<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pinnacle-style slip</title><style>body{font-family:sans-serif;display:flex;gap:24px}main{flex:1}.row{display:flex;gap:8px;align-items:center;margin:6px 0}button{padding:6px 10px}aside{width:300px;border:1px solid #999;padding:10px}.card-htb3BvHCKc{border:1px solid #ccc;padding:8px;margin:6px 0}.receipt{background:#d2f7d7;padding:8px}</style></head><body>
<!-- Slip structure (classes, data-test-id, the Stake + Win inputs) copied from pinnacle.com as probed
     on 24 Sep 2026 (logged out). Logged-in wording from the user's pinnacle.bet.br screenshots:
     EN "Total Stake / Total Win / Max bet / CONFIRM 1 SINGLE BET" → "Bet Accepted / #… / Stake / Win / Reuse selections";
     PT "Risco / Ganho / Aposta máx. / CONFIRMAR 1 SIMPLES APOSTA" → "Aceitar aposta / #… / Risco / Ganho / Reutilizar seleção".
     ?btn=… replaces the button text (a wording nobody listed) to test detection from the confirmation alone. -->
<main><h2>MLB</h2>
  <div class="row"><span>Tampa Bay Rays</span><span>New York Yankees</span><button>2.350</button><button id="pick">1.684</button><button>+1.5 1.561</button><button>6 1.943</button></div>
  <div class="row"><span>Cincinnati Reds</span><span>Atlanta Braves</span><button>3.020</button><button>1.446</button></div></main>
<aside id="betslip">
  <div><span id="t-slip">BET SLIP</span> <span id="t-my">MY BETS</span></div>
  <div id="t-singles">SINGLES</div>
  <div id="rc"></div>
  <div class="card-htb3BvHCKc betslip-card" data-test-id="Betslip-Card"><div><div>
    <div class="details-r7uw6SdutY betslipCardDetails" data-test-id="Betslip-SelectionDetails">
      <button class="betslip-close-button" aria-label="Remove card">×</button>
      <div class="title-a4XsNOISuw selectionDetailsTitle" data-test-id="SelectionDetails-Title"><div class="matchupName-LaAwbv3B5f selectionDetailsMatchupName" id="mu">Tampa Bay Rays - New York Yankees</div></div>
      <div class="wagerSummary-tMZiOFJE1I selectionDetailsWagerSummary" data-test-id="SelectionDetails-WagerType" id="ws">Money Line – Game – MLB</div>
      <div class="selectionDetailsPriceContainer"><div class="priceLabel-ed9hOwL2kK"><span class="priceLabelAlt-yVgb64qTbS" data-test-id="SelectionDetails-Selection">New York Yankees</span></div>
        <div class="price-LzIMsRnyMY betslipCardPrice" data-test-id="SelectionDetails-Odds"><span>1.684</span></div></div>
    </div>
    <div class="container-pX0J2FEftz betslipCardStakeWinInput" data-test-id="Betslip-StakeWinInput" id="inputs"><div class="inputContainer-Zj_WvNK9zc">
      <div class="inputBox-Dli1iDw9gB"><label id="l-stake">Stake</label><input id="stake" aria-label="Currency Input" type="text"></div>
      <div class="inputBox-Dli1iDw9gB"><label id="l-win">Win</label><input id="win" aria-label="Currency Input" type="text"></div></div>
      <div><span id="t-max">Max bet</span> <u>BRL 75,860.14</u></div></div>
  </div></div></div>
  <div id="totals"><div><span id="t-ts">Total Stake</span> <b id="ts">BRL 0.00</b></div><div><span id="t-tw">Total Win</span> <b id="tw">BRL 0.00</b></div></div>
  <button id="place" class="placeBetButton"><span id="t-place">CONFIRM 1 SINGLE BET</span></button>
</aside>
<script>
const q = new URLSearchParams(location.search), PT = q.get('lang') === 'pt';
const T = PT ? { slip: 'BOLETIM DE APOSTAS', my: 'MINHAS APOSTAS', singles: 'SIMPLES', ws: 'Money Line – Jogo – MLB', stake: 'Risco', win: 'Ganho', max: 'Aposta máx.', ts: 'Total Risco', tw: 'Total Ganho', place: 'CONFIRMAR 1 SIMPLES APOSTA', ok: 'Aceitar aposta', reuse: 'Reutilizar seleção' }
              : { slip: 'BET SLIP', my: 'MY BETS', singles: 'SINGLES', ws: 'Money Line – Game – MLB', stake: 'Stake', win: 'Win', max: 'Max bet', ts: 'Total Stake', tw: 'Total Win', place: 'CONFIRM 1 SINGLE BET', ok: 'Bet Accepted', reuse: 'Reuse selections' };
if (q.get('btn')) T.place = q.get('btn');
if (PT) document.documentElement.lang = 'pt-BR';
const g = (id) => document.getElementById(id), brl = (v) => 'BRL ' + v.toFixed(2);
[['t-slip', 'slip'], ['t-my', 'my'], ['t-singles', 'singles'], ['ws', 'ws'], ['l-stake', 'stake'], ['l-win', 'win'], ['t-max', 'max'], ['t-ts', 'ts'], ['t-tw', 'tw'], ['t-place', 'place']].forEach(([id, k]) => { g(id).textContent = T[k]; });
g('stake').addEventListener('input', () => { const v = parseFloat(g('stake').value.replace(',', '.')) || 0; g('win').value = (v * 0.684).toFixed(2); g('ts').textContent = brl(v); g('tw').textContent = brl(v * 0.684); });
g('place').addEventListener('click', () => { const v = parseFloat(g('stake').value.replace(',', '.')) || 0;
  setTimeout(() => { g('inputs').remove(); g('totals').remove(); g('place').remove();
    g('rc').innerHTML = '<div class="receipt"><div><b>' + T.ok + '</b></div><div><b>#3128663429</b></div><div><b>' + T.stake + '</b> ' + brl(v) + '</div><div><b>' + T.win + '</b> ' + brl(v * 0.684) + '</div><hr><div><u>' + T.reuse + '</u></div></div>'; }, 900); });
</script></body></html>
